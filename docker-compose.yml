services:
  postgres:
    image: postgres:16-alpine
    container_name: gestion-granjas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestion-granjas-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: gestion-granjas-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3001}:3001'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestion-granjas-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: gestion-granjas-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NODE_ENV: production
    depends_on:
      - api
    networks:
      - gestion-granjas-network

volumes:
  postgres_data:

networks:
  gestion-granjas-network:
    name: gestion-granjas-network
